          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "502":
          description: Stellar rejected the transaction
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Transfer funds to another wallet
      tags:
      - wallet
  /wallet/{id}/pin:
    post:
      consumes:
      - application/json
      description: Set or replace the 4-8 digit PIN that authorises payments from
        this wallet.
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
