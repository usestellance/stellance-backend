            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/recurring.RecurringInvoice'
                  type: array
              type: object
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: List recurring invoice schedules
      tags:
      - recurring
    post:
      consumes:
      - application/json
      description: Create a schedule that generates an invoice at each interval.
      parameters:
      - description: Recurring invoice config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/recurring.CreateRecurringDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Schedule created
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/recurring.RecurringCreated'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Create recurring invoice schedule
      tags:
      - recurring
  /recurring/{id}:
    delete:
      description: Delete a schedule. Invoices it already generated are kept.
      parameters:
      - description: Recurring ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Schedule deleted
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Delete recurring schedule
      tags:
      - recurring
    get:
      description: One recurring schedule.
      parameters:
      - description: Recurring ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Schedule
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/recurring.RecurringInvoice'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get recurring schedule by ID
      tags:
      - recurring
    patch:
      consumes:
      - application/json
      description: Pause or resume a schedule (`is_active`), change its `interval`
        or reset its next run date (`start_date`).
      parameters:
      - description: Recurring ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/recurring.UpdateRecurringDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Schedule updated
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Update recurring schedule
      tags:
      - recurring
  /transaction:
    get:
      description: 'Paginated ledger of the signed-in user: payments received, funding
        and outgoing transfers. `status` is the on-chain result; verification results
        live on /payments.'
      parameters:
      - description: Filter by user ID (admin only)
        in: query
        name: user_id
        type: string
      - description: Page number, from 1 (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page, default 10 (page_count is a deprecated alias)
        in: query
        name: limit
        type: integer
      - description: Ledger type
        enum:
        - payment
        - withdrawal
        - funding
        - path_payment
        in: query
        name: type
        type: string
      - description: On-chain status
        enum:
        - pending
        - confirmed
        - failed
        - aborted
        - refunded
        in: query
        name: status
        type: string
      - description: Created on or after this date, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: Created on or before this date, YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Transactions page
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/transactions.PaginatedTransactions'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: List transactions
      tags:
      - transactions
  /transaction/{id}:
    delete:
      description: Delete a ledger entry owned by the caller.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Delete a transaction
      tags:
      - transactions
  /transaction/id/{id}:
    get:
      description: One ledger entry owned by the caller.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Transaction
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/transactions.GetTransactionDto'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get transaction by ID
      tags:
      - transactions
  /transaction/inflow:
    get:
      description: Paid-invoice cash flow grouped by month between `from` and `to`
        (YYYY-MM-DD). Amounts are integer cents.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cash flow
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/transactions.GetTransactionCashFlowResponse'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get cash flow over a date range
      tags:
      - transactions
  /transaction/stats:
    get:
      description: 'Invoice amounts per bucket, in integer cents: total, pending (draft,
        sent, viewed, pending, payment_detected), paid, overdue, expired and invalid_payment.'
      produces:
      - application/json
      responses:
        "200":
          description: Amounts in cents
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/transactions.GetTransactionOverViewResponse'
              type: object
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get transaction overview stats
      tags:
      - transactions
  /transaction/status/{id}:
    get:
      description: Look up the on-chain status of a ledger entry and its explorer
        link.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Status
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/transactions.PaymentStatusResult'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Check payment status
      tags:
      - transactions
  /wallet:
    post:
      description: Create the user's Stellar wallet (one per user). On testnet the
        account is funded in the background. The secret key is stored encrypted.
      produces:
      - application/json
      responses:
        "201":
          description: Wallet created
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/wallet.WalletResponseDto'
              type: object
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "403":
          description: 'Wallet limit reached: one wallet per user'
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Create a Stellar wallet
      tags:
      - wallet
  /wallet/{id}:
    get:
      description: Wallet details with live balances.
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Wallet
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/wallet.WalletResponseDto'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "403":
          description: 'Access denied: not your wallet'
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get wallet by ID
      tags:
      - wallet
  /wallet/{id}/pay/invoice:
    post:
      consumes:
      - application/json
      description: Pay an invoice from this wallet, swapping XLM or USDC to the invoice
        asset by path payment. The memo is the invoice's payment reference; settlement
        happens only after the chain payment is verified, so `payment_status` may
        still be `detected`.
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: string
      - description: Payment details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wallet.PayInvoiceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Payment submitted
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/wallet.PathPaymentResult'
              type: object
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "409":
          description: Another payment is being verified, or the merchant has no wallet
            (error=wallet_required)
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "502":
          description: Stellar rejected the transaction
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Pay an invoice via path payment
      tags:
      - wallet
  /wallet/{id}/pay/transfer:
    post:
      consumes:
      - application/json
      description: Transfer XLM or USDC to another address, converting between assets
        by path payment if needed.
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
