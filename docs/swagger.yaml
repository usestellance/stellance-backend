securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Sign-up, sign-in (password and Google), email verification and password
    reset
  name: auth
- description: Profile of the signed-in user and its primary wallet
  name: profile
- description: Create, send, review, search and download invoices
  name: invoices
- description: Payment requests, detected on-chain payments and their verification
    results
  name: payments-v2
- description: Stellar wallet, PIN, transfers and invoice payments
  name: wallet
- description: Ledger of money movements and cash-flow statistics
  name: transactions
- description: In-app notifications, including payment outcomes
  name: notifications
- description: Invoice comment threads and reactions
  name: comments
- description: Recurring invoice schedules
  name: recurring
- description: Admin-only management of users, invoices, transactions, payments and
    network settings
  name: admin
