          $ref: '#/definitions/wallet.TransferDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Transfer submitted
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/wallet.PathPaymentResult'
