host: localhost:4000
info:
  contact:
    email: davidhero125@gmail.com
    name: API Support
  description: |-
    Invoice management and Stellar payment platform API.

    **Envelope.** Every JSON response is `{status_code, message, data?, error?}`; the types below describe `data`.
    **Auth.** Send `Authorization: Bearer <access_token>`. Tokens last 1 hour; deleted or deactivated users are rejected immediately. Unverified emails cannot sign in.
    **Pagination.** List endpoints take `page` (from 1) and `limit`, and return `{items, meta:{page, limit, total, total_pages}}`. Old names (`page_count`, `count`, `payments`, `invoice`, `data`, `notifications`) still work and are deprecated.
    **Amounts.** Payment records and requests use 7-decimal strings (`"2.0300000"`). Invoice and ledger fields are JSON numbers in the invoice currency. `/transaction/stats` and `/transaction/inflow` are integer cents. See docs/api-conventions.md.
    **Payments (v2).** Invoices are paid with a text memo equal to the invoice's `payment_reference`. The server detects and verifies the on-chain payment; only a verified payment marks an invoice paid. Status values and transitions are in docs/payment-status-model.md.
    **Errors.** 400 invalid input, 401 missing or invalid token, 403 not allowed, 404 not found, 409 state conflict, 422 valid request that fails a business rule, 502 Stellar unreachable, 500 unexpected.
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: Stellance API
  version: "1.0"
paths:
  /admin/config/network:
    get:
      description: Stellar network (testnet or mainnet) used by payment detection
        and wallet operations. Seeded as `testnet` at server start when unset.
      produces:
      - application/json
      responses:
        "200":
          description: Current network
          schema:
            allOf:
            - $ref: '#/definitions/utils.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.NetworkConfig'
              type: object
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "403":
          description: Caller is not an admin
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Network config not set
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get current Stellar network stage
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Switch the Stellar network. Payment cursors are kept per network,
        so switching does not replay history.
      parameters:
      - description: Target network
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.NetworkUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Network updated
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "403":
          description: Caller is not an admin
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Switch Stellar network stage
      tags:
      - admin
