basePath: /api/v1
definitions:
  admin.ActivityLog:
    properties:
      action:
        description: Action name
        example: login
        type: string
      created_at:
        description: When it happened
        example: "2026-10-22T14:03:26Z"
        type: string
      entity_id:
        description: Id of the object acted on
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      entity_type:
        description: Kind of object acted on
        example: invoice
        type: string
      id:
        description: Entry id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      ip_address:
        description: Client IP
        example: 203.0.113.7
        type: string
      metadata: {}
      user_id:
        description: Acting user
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
    type: object
  admin.AdminActivityList:
    properties:
      logs:
        items:
          $ref: '#/definitions/admin.ActivityLog'
        type: array
      meta:
        $ref: '#/definitions/admin.AdminPaginationMeta'
    type: object
  admin.AdminInvoiceList:
    properties:
      invoices:
        items:
          $ref: '#/definitions/admin.AdminInvoiceRow'
        type: array
      meta:
        $ref: '#/definitions/admin.AdminPaginationMeta'
    type: object
  admin.AdminInvoiceRow:
    properties:
      created_at:
        description: Created
        example: "2026-10-20T09:00:00Z"
        type: string
      creator_email:
        description: Creator
        example: jane@example.com
        type: string
      currency:
        description: Currency
        example: usdc
        type: string
      id:
        description: Invoice id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      invoice_number:
        description: Number
        example: INV-20261020-0019
        type: string
      payer_email:
        description: Client
        example: billing@acme.com
        type: string
      status:
        description: Invoice status
        example: paid
        type: string
      total:
        description: Amount due
        example: 454
        type: number
    type: object
  admin.AdminPaginationMeta:
    properties:
      limit:
        description: Page size
        example: 20
        type: integer
      page:
        description: Current page
        example: 1
        type: integer
      total:
        description: Total matching rows
        example: 57
        type: integer
      total_pages:
        description: Total pages
        example: 3
        type: integer
    type: object
  admin.AdminStats:
    properties:
      active_users:
        description: Active users
        example: 112
        type: integer
      overdue_count:
        description: Invoices in overdue status
        example: 12
        type: integer
      paid_invoices:
        description: Paid invoices
        example: 310
        type: integer
      total_invoices:
        description: All invoices
        example: 560
        type: integer
      total_revenue:
        description: Sum of paid invoice totals
        example: 48210.5
        type: number
      total_users:
        description: All users
        example: 120
        type: integer
    type: object
  admin.AdminTransactionList:
    properties:
      meta:
        $ref: '#/definitions/admin.AdminPaginationMeta'
      transactions:
        items:
          $ref: '#/definitions/admin.AdminTransactionRow'
        type: array
    type: object
  admin.AdminTransactionRow:
    properties:
      amount:
        description: Amount
        example: 2.03
        type: number
      created_at:
        description: Created
        example: "2026-10-22T14:03:26Z"
        type: string
      id:
        description: Ledger entry id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      invoice_number:
        description: Related invoice
        example: INV-20261020-0019
        type: string
      source_amount:
        description: Amount spent
        example: "12.3456789"
        type: string
      source_asset:
        description: Asset spent for path payments
        example: XLM
        type: string
      status:
        description: On-chain result
        example: confirmed
        type: string
      type:
        description: payment, withdrawal, funding or path_payment
        example: payment
        type: string
      user_email:
        description: Owner
        example: jane@example.com
        type: string
    type: object
  admin.AdminUserDetail:
    properties:
      recent_activity:
        items:
          $ref: '#/definitions/admin.ActivityLog'
        type: array
      recent_transactions:
        items:
          $ref: '#/definitions/admin.AdminTransactionRow'
        type: array
      user:
        $ref: '#/definitions/admin.AdminUserRow'
      wallets:
        items:
          $ref: '#/definitions/admin.AdminWalletRow'
        type: array
    type: object
  admin.AdminUserList:
    properties:
      meta:
        $ref: '#/definitions/admin.AdminPaginationMeta'
      users:
        items:
          $ref: '#/definitions/admin.AdminUserRow'
        type: array
    type: object
  admin.AdminUserRow:
    properties:
      created_at:
        description: Created
        example: "2026-10-20T09:00:00Z"
        type: string
      email:
        description: Email
        example: jane@example.com
        type: string
      email_verified:
        description: Verified
        example: true
        type: boolean
      first_name:
        description: First name
        example: Jane
        type: string
      id:
        description: User id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      is_active:
        description: Active
        example: true
        type: boolean
      last_name:
        description: Last name
        example: Doe
        type: string
      role:
        description: user or admin
        example: user
        type: string
    type: object
  admin.AdminWalletRow:
    properties:
      address:
        description: Stellar account id
        example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        type: string
      id:
        description: Wallet id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      is_primary:
        description: Receives invoice payments
        example: true
        type: boolean
      tag:
        description: Label
        example: Main
        type: string
      usdc_balance:
        description: Cached USDC balance
        example: 5.03
        type: number
      xlm_balance:
        description: Cached XLM balance
        example: 10002
        type: number
    type: object
  admin.NetworkConfig:
    properties:
      stage:
        enum:
        - testnet
        - mainnet
        type: string
      updated_at:
        description: When the setting last changed
        example: "2026-10-22T14:03:26Z"
        type: string
    type: object
  admin.NetworkUpdate:
    properties:
      stage:
        description: Network used by wallets and payment detection
        enum:
        - testnet
        - mainnet
        example: testnet
        type: string
    type: object
  auth.AuthLoginResponseDto:
    properties:
      access_token:
        description: Bearer token, valid for 1 hour
        example: eyJhbGciOi...
        type: string
      email_verified:
        description: Always true on a successful login
        example: true
        type: boolean
      expires_in:
        description: Unix time the token expires
        example: 1793000000
        type: integer
      profile_complete:
        description: False until POST /profile has been called
        example: false
        type: boolean
      user:
        $ref: '#/definitions/user.User'
    type: object
  auth.AuthRequestDto:
    properties:
      email:
        description: Account email, case-insensitive
        example: jane@example.com
        type: string
      password:
        description: Password; must satisfy the password policy
        example: S3cure!pass
        type: string
    required:
    - email
    - password
    type: object
  auth.AuthResponseDto:
    properties:
      access_token:
        description: Bearer token, valid for 1 hour
        example: eyJhbGciOi...
        type: string
      email_verified:
        description: New accounts start unverified
        example: false
        type: boolean
      expires_in:
        description: Unix time the access token expires
        example: 1793000000
        type: integer
      profile_complete:
        description: Profile onboarding done
        example: false
        type: boolean
      refresh_token:
        description: Only on the refresh endpoint
        type: string
      refresh_token_expiry:
        description: Unix time the refresh token expires
        example: 1793600000
        type: integer
      user:
        $ref: '#/definitions/user.UserProfileDto'
    type: object
  auth.ChangePasswordDTO:
    properties:
      new_password:
        description: New password, 8-100 characters
        example: N3w!password
        maxLength: 100
        minLength: 8
        type: string
      old_password:
        description: Current password
        example: S3cure!pass
        type: string
    required:
    - new_password
    - old_password
    type: object
  auth.PasswordChangedResult:
    properties:
      changedAt:
        description: When the password changed
        example: "2026-10-22T14:03:26Z"
        type: string
    type: object
  auth.ProviderLogin:
    properties:
      id_token:
        description: Google ID token (JWT) from Google Sign-In; verified server-side
        example: eyJhbGciOiJSUzI1NiIs...
        type: string
    required:
    - id_token
    type: object
  auth.RefreshTokenResult:
    properties:
      refresh_token:
        description: 7-day refresh token
        example: eyJhbGciOi...
        type: string
      refresh_token_expiry:
        example: 1793000000
        type: integer
    type: object
  auth.ResetPasswordDto:
    properties:
      confirm_password:
        description: Must equal password
        example: N3w!password
        type: string
      email:
        description: Email the reset link was sent to
        example: jane@example.com
        type: string
      otp:
        description: Code from the reset email
        example: "48213"
        maxLength: 6
        minLength: 2
        type: string
      password:
        description: New password
        example: N3w!password
        type: string
    required:
    - confirm_password
    - email
    - otp
    - password
    type: object
  invoice.CreateInvoiceDTO:
    properties:
      country:
        description: Client country
        example: NG
        type: string
      due_date:
        description: YYYY-MM-DD. Payments are accepted until the end of this day (UTC)
          plus PAYMENT_EXPIRY_GRACE_DAYS
        example: "2026-12-31"
        type: string
      invoice_items:
        description: At least one line item
        items:
          $ref: '#/definitions/invoice.InvoiceItems'
        minItems: 1
        type: array
      make_default:
        description: Save this template as the default
        example: false
        type: boolean
      note:
        description: Optional note shown on the invoice
        example: Thanks for your business
        type: string
      payer_email:
        description: Client email the invoice is sent to
        example: billing@acme.com
        type: string
      payer_name:
        description: Client name
        example: Acme Ltd
        type: string
      service_fee:
        description: Extra fee added to the subtotal, >= 0
        example: 2.5
        minimum: 0
        type: number
      template_id:
        allOf:
        - $ref: '#/definitions/invoice.TemplateIDType'
        description: One of template_001..template_005
        example: template_001
      title:
        description: Invoice title, min 3 characters
        example: Website redesign
        minLength: 3
        type: string
    required:
    - country
    - due_date
    - invoice_items
    - payer_email
    - payer_name
    - template_id
    - title
    type: object
  invoice.InvoiceItems:
    properties:
      amount:
        description: Line total; the server checks it against quantity x unit_price
        example: 451.5
        type: number
      created_at:
        description: When the item was added
        example: "2026-10-20T09:00:00Z"
        type: string
      description:
        description: What was delivered
        example: Design work
        type: string
      discount:
        description: Discount percent
        example: 0
        type: integer
      invoice_type:
        allOf:
        - $ref: '#/definitions/invoice.InvoiceType'
        description: per_hour or per_unit
        enum:
        - per_hour
        - per_unit
        example: per_unit
      item_id:
        description: Existing item id when editing; omit for new items
        type: string
      quantity:
        description: Hours or units, > 0
        example: 3
        type: integer
      unit_price:
        description: Price per hour or unit, > 0
        example: 150.5
        type: number
    required:
    - amount
    - description
    - invoice_type
    - quantity
    - unit_price
    type: object
  invoice.InvoiceListResponseDto:
    properties:
      invoice:
        description: 'deprecated: use items'
        items:
          $ref: '#/definitions/invoice.InvoiceResponse'
        type: array
      items:
        items:
          $ref: '#/definitions/invoice.InvoiceResponse'
        type: array
      meta:
        $ref: '#/definitions/invoice.PaginationMeta'
    type: object
  invoice.InvoiceResponse:
    properties:
      approved:
        description: Payer review result; null before review
        example: true
        type: boolean
      country:
        description: Client country
        example: NG
        type: string
      created_at:
        description: Creation time
        example: "2026-10-20T09:00:00Z"
        type: string
      createdBy:
        $ref: '#/definitions/invoice.InvoiceSenderDetails'
      currency:
        description: usdc or xlm
        example: usdc
        type: string
      due_date:
        description: Due date
        example: "2026-12-31T00:00:00Z"
        type: string
      id:
        description: Invoice id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      invoice_number:
        description: Human-readable number
        example: INV-20261020-0019
        type: string
      invoice_url:
        description: Short public url used by /invoice/search and /payments/request
        example: aB3dE9
        type: string
      items:
        items:
          $ref: '#/definitions/invoice.InvoiceItems'
        type: array
      logo_url:
        description: Signed logo url
        type: string
      note:
        description: Note shown on the invoice
        type: string
      paid_at:
        description: Set once paid
        example: "2026-10-22T14:03:26Z"
        type: string
      payer_email:
        description: Client email
        example: billing@acme.com
        type: string
      payer_name:
        description: Client name
        example: Acme Ltd
        type: string
      payer_wallet_address:
        description: Account that paid; set once paid
        example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        type: string
      payment_reference:
        description: Memo to attach to the on-chain payment
        example: STL-B9371BD3A173
        type: string
      payment_status:
        description: Derived from status; see docs/payment-status-model.md
        example: awaiting_payment
        type: string
      review_date:
        description: When the payer approved or rejected
        example: "2026-10-21T10:00:00Z"
        type: string
      service_fee:
        description: Fee added to the subtotal
        example: 2.5
        type: number
      status:
        description: draft, sent, viewed, pending, overdue, payment_detected, invalid_payment,
          paid, expired, cancelled or refunded
        example: sent
        type: string
      sub_total:
        description: Sum of line items
        example: 451.5
        type: number
      template_id:
        allOf:
        - $ref: '#/definitions/invoice.TemplateIDType'
        description: Template
        example: template_001
      title:
        description: Title
        example: Website redesign
        type: string
      total:
        description: Amount due
        example: 454
        type: number
      updated_at:
        description: Last change
        example: "2026-10-22T14:03:26Z"
        type: string
    required:
    - template_id
    type: object
  invoice.InvoiceSearchResult:
    properties:
      invoice:
        items:
          $ref: '#/definitions/invoice.InvoiceResponse'
        type: array
      meta:
        $ref: '#/definitions/invoice.SearchPaginationMeta'
    type: object
  invoice.InvoiceSendResult:
    properties:
      invoice_url:
        example: aB3dE9
        type: string
      total_recipients:
        example: 2
        type: integer
    type: object
  invoice.InvoiceSenderDetails:
    properties:
      business_name:
        description: Business name
        example: Doe Studio
        type: string
      email:
        description: Hidden on the public view
        example: jane@example.com
        type: string
      location:
        description: Creator country
        example: NG
        type: string
      name:
        description: Creator name
        example: Jane Doe
        type: string
      phone_number:
        description: Hidden on the public view
        example: "+2348012345678"
        type: string
      user_id:
        description: Creator id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      wallet_address:
        description: Creator primary wallet
        example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        type: string
    type: object
  invoice.InvoiceStatsResponse:
    properties:
      expired_count:
        example: 2
        type: integer
      invalid_payment_count:
        example: 1
        type: integer
      overdue_count:
        example: 0
        type: integer
      paid_count:
        example: 12
        type: integer
      pending_count:
        example: 4
        type: integer
      total_count:
        example: 19
        type: integer
    type: object
  invoice.InvoiceStatusDataPoint:
    properties:
      status:
        description: Capitalised status name
        example: Paid
        type: string
      value:
        description: Invoices in this status
        example: 12
        type: integer
    type: object
  invoice.InvoiceType:
    enum:
    - per_unit
    - per_hour
    type: string
    x-enum-varnames:
    - PerUnit
    - PerHour
  invoice.InvoiceUpdateResult:
    properties:
      invoice_id:
        description: Updated invoice
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      updated_at:
        description: Update time
        example: "2026-10-22T14:03:26Z"
        type: string
    type: object
  invoice.MarkInvoicePaidDTO:
    properties:
      transaction_hash:
        description: 64-character hex Stellar transaction hash. The server re-verifies
          it on-chain
        example: a9f9fde3c0e1d5b7a9f9fde3c0e1d5b7a9f9fde3c0e1d5b7a9f9fde3c0e1d5b7
        type: string
    required:
    - transaction_hash
    type: object
  invoice.MarkPaidResult:
    properties:
      invoice_id:
        description: Invoice id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      payment:
        description: The verified payment record
      status:
        example: paid
        type: string
    type: object
  invoice.PaginationMeta:
    properties:
      limit:
        description: Page size
        example: 10
        type: integer
      page:
        description: Current page
        example: 1
        type: integer
      page_count:
        description: 'deprecated: use limit'
        type: integer
      total:
        description: Total matching invoices
        example: 57
        type: integer
      total_invoice_count:
        description: 'deprecated: use total'
        type: integer
      total_pages:
        description: Total pages
        example: 6
        type: integer
    type: object
  invoice.ReviewInvoiceDTO:
    properties:
      approve:
        description: true approves, false rejects (cancels) the invoice
        example: true
        type: boolean
    type: object
  invoice.SearchPaginationMeta:
    properties:
      has_next:
        description: More rows after this page
        example: true
        type: boolean
      has_prev:
        description: Rows before this page
        example: false
        type: boolean
      limit:
        description: Page size
        example: 10
        type: integer
      offset:
        description: Rows skipped
        example: 0
        type: integer
      total:
        description: Total matches
        example: 57
        type: integer
    type: object
  invoice.SendInvoiceDto:
    properties:
      emails:
        description: 1-10 recipient emails; the first is the primary recipient, the
          rest are CC
        items:
          type: string
        maxItems: 10
        minItems: 1
        type: array
    required:
    - emails
    type: object
  invoice.TemplateIDType:
    enum:
    - template_001
    - template_002
    - template_003
    - template_004
    - template_005
    type: string
    x-enum-varnames:
    - TemplateID1
    - TemplateID2
    - TemplateID3
    - TemplateID4
    - TemplateID5
  invoice_comments.CommentResponse:
    properties:
      can_delete:
        description: Viewer may delete
        example: true
        type: boolean
      can_edit:
        description: Viewer may edit
        example: true
        type: boolean
      comment_text:
        description: Comment body
        example: Looks good
        type: string
      commenter_email:
        description: Author email
        example: jane@example.com
        type: string
      commenter_name:
        description: Display name
        example: Jane Doe
        type: string
      created_at:
        description: Posted
        example: "2026-10-22T14:03:26Z"
        type: string
      edited:
        description: Edited after posting
        example: false
        type: boolean
      edited_at:
        description: When last edited
        type: object
      id:
        description: Comment id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      invoice_id:
        description: Invoice id
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      is_guest:
        description: Author commented with a guest token
        example: false
        type: boolean
      is_verified:
        description: Author is a verified account
        example: true
        type: boolean
      parent_comment_id:
        description: Parent comment when this is a reply
        type: object
      parent_id:
        description: Same as parent_comment_id
        type: object
      reactions:
        items:
          $ref: '#/definitions/invoice_comments.ReactionCount'
        type: array
      replies:
        items:
          $ref: '#/definitions/invoice_comments.CommentResponse'
        type: array
      updated_at:
        description: Last change
        example: "2026-10-22T14:03:26Z"
        type: string
      user_id:
        description: Author id; empty for guests
        type: object
    type: object
  invoice_comments.CreateCommentDTO:
    properties:
      comment_text:
        description: 1-2000 characters
        example: Can you split this into two payments?
        maxLength: 2000
        minLength: 1
        type: string
      invoice_id:
        description: Invoice being discussed
        example: 3f2b8c1e-5d4a-4f6b-9c7d-1a2b3c4d5e6f
        type: string
      parent_id:
        description: Comment id to reply to; omit for a top-level comment
        type: string
      token:
        description: Invoice access token for guests; omit when signed in
        type: string
    required:
    - comment_text
    - invoice_id
    type: object
  invoice_comments.CreateCommentQueryResponse:
    properties:
      created_at:
        type: string
      guest:
        type: boolean
      id:
        type: string
      verified:
        type: boolean
    type: object
  invoice_comments.GetCommentsResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/invoice_comments.CommentResponse'
        type: array
      limit:
        description: Page size
        example: 20
        type: integer
      page:
        description: Current page
        example: 1
        type: integer
      stats:
        $ref: '#/definitions/invoice_comments.InvoiceCommentStats'
      total:
        description: Total top-level comments
        example: 8
        type: integer
      total_pages:
        description: Total pages
