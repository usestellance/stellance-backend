            $ref: '#/definitions/utils.ApiResponse'
        "400":
          description: Invalid request body or parameters
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "401":
          description: Missing or invalid bearer token
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "403":
          description: Not your wallet
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/utils.ApiResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/utils.ApiResponse'
      security:
      - BearerAuth: []
      summary: Set or update transaction PIN
      tags:
      - wallet
  /wallet/export/{id}:
    get:
      description: 'Return the wallet''s secret key. Sensitive: the response must
        never be logged or cached.'
      parameters:
      - description: Wallet ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
